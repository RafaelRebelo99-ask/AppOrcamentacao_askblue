<html>

<head>
    <title>AskBlue SGS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="askblue.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container align-center">
        <div class="card column" style="padding: 4rem;">
            <div class="row center mb-1">
                <img id="logo" src="askblue-logo-oficial-rgb.png" class="logo" style="width: 15rem;">
            </div>
            <div class="row mb-1">
                <h1>Log In</h1><button id="themeBtn" class="more-actions"><i class="bi bi-moon"></i></button>
            </div>
            <form>
                <div class="input-group">
                    <label for="password">Email</label>
                    <div class="empty-box mb-05">
                        <input id="email" required type="email" placeholder="Email">
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="empty-box">
                        <input id="password" required type="password" placeholder="Password">
                        <button type="button" class="icon ml-auto"><i id="show-password" class="bi bi-eye"></i></button>
                    </div>
                </div>

                <p class="hint mb-05">A password deve conter pelo menos X caracteres.</p>
                <div class="row mb-1">
                    <button id="remember-me" type="button" class="checkbox">
                        <i class="bi bi-check"></i>
                    </button>
                    <p>Lembrar detalhes</p>
                </div>

                <button type="submit" class="primary w-100">Log In</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
    <script src="dark-mode.js" defer></script>

</body>
